x-common-env: &common_env
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-warn}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: ${REDIS_DB:-0}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  AUTH_SERVICE_URL: auth-service:9090
  USER_SERVICE_URL: user-service:9090
  TENANT_SERVICE_URL: tenant-service:9090
  ADMIN_SERVICE_URL: admin-service:9090
  STAFF_SERVICE_URL: staff-service:9090
  PAYROLL_SERVICE_URL: payroll-service:9090
  PROJECT_SERVICE_URL: projects-service:9090
  CRM_SERVICE_URL: crm-service:9090
  FINANCE_SERVICE_URL: finance-service:9090
  ANALYTICS_SERVICE_URL: analytics-service:9090
  AUTHORIZATION_SERVICE_URL: authorization-service:9090
  DOCUMENTS_SERVICE_URL: documents-service:9090
  NOTIFICATIONS_SERVICE_URL: notifications-service:9090
  VENDOR_SERVICE_URL: vendor-service:9090

networks:
  erp-net:
    driver: bridge

services:
  ingress:
    image: nginx:1.25-alpine
    container_name: erp-ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/erp-ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - auth-service
      - user-service
      - tenant-service
      - admin-service
      - staff-service
      - payroll-service
      - projects-service
      - crm-service
      - finance-service
      - analytics-service
      - authorization-service
      - documents-service
      - notifications-service
      - vendor-service
    networks:
      - erp-net
  auth-service:
    image: ghcr.io/ayist-erp-system/auth-service:${TAG_AUTH:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: auth_schema
      DB_USER: auth_user
      JWT_ISSUER: ${JWT_ISSUER:-ayist}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-168h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15m}
      TOTP_ISSUER: ${TOTP_ISSUER:-ayist}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-64}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-true}
      PASSWORD_REQUIRE_NUMBERS: ${PASSWORD_REQUIRE_NUMBERS:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-true}
      JWT_SECRET: ${AUTH_JWT_SECRET}
    depends_on:
      - tenant-service
      - user-service
      - authorization-service
    networks:
      - erp-net

  admin-service:
    image: ghcr.io/ayist-erp-system/admin-service:${TAG_ADMIN:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: admin_schema
      DB_USER: admin_user
      JWT_SECRET: ${ADMIN_JWT_SECRET}
    depends_on:
      - tenant-service
      - staff-service
      - auth-service
      - authorization-service
    networks:
      - erp-net

  user-service:
    image: ghcr.io/ayist-erp-system/user-service:${TAG_USER:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: users_schema
      DB_USER: users_user
    depends_on:
      - auth-service
    networks:
      - erp-net

  tenant-service:
    image: ghcr.io/ayist-erp-system/tenant-service:${TAG_TENANT:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: tenant_schema
      DB_USER: tenant_user
    depends_on:
      - auth-service
    networks:
      - erp-net
  authorization-service:
    image: ghcr.io/ayist-erp-system/authorization-service:${TAG_AUTHZ:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: authorization_schema
      DB_USER: authorization_user
    depends_on:
      - tenant-service
      - auth-service
    networks:
      - erp-net

  staff-service:
    image: ghcr.io/ayist-erp-system/staff-service:${TAG_STAFF:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: staff_schema
      DB_USER: staff_user
    depends_on:
      - auth-service
      - payroll-service
      - user-service
      - projects-service
    networks:
      - erp-net

  payroll-service:
    image: ghcr.io/ayist-erp-system/payroll-service:${TAG_PAYROLL:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: payroll_schema
      DB_USER: payroll_user
    depends_on:
      - auth-service
    networks:
      - erp-net

  projects-service:
    image: ghcr.io/ayist-erp-system/projects-service:${TAG_PROJECTS:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      NODE_ENV: production
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: projects_schema
      DB_USER: projects_user
    depends_on:
      - auth-service
    networks:
      - erp-net

  crm-service:
    image: ghcr.io/ayist-erp-system/crm-service:${TAG_CRM:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      NODE_ENV: production
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: crm_schema
      DB_USER: crm_user
    depends_on:
      - auth-service
    networks:
      - erp-net

  documents-service:
    image: ghcr.io/ayist-erp-system/documents-service:${TAG_DOCS:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: documents_schema
      DB_USER: documents_user
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_ENDPOINT: ${S3_ENDPOINT}

    depends_on:
      - auth-service
      - tenant-service
      - authorization-service
    networks:
      - erp-net

  notifications-service:
    image: ghcr.io/ayist-erp-system/notifications-service:${TAG_NOTIFICATIONS:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      NODE_ENV: production
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: notifications_schema
      DB_USER: notifications_user
    depends_on:
      - auth-service
    networks:
      - erp-net

  analytics-service:
    image: ghcr.io/ayist-erp-system/analytics-service:${TAG_ANALYTICS:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: analytics_schema
      DB_USER: analytics_user
    depends_on:
      - auth-service
    networks:
      - erp-net
  finance-service:
    image: ghcr.io/ayist-erp-system/finance-service:${TAG_FINANCE:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: finance_schema
      DB_USER: finance_user
    depends_on:
      - auth-service
      - documents-service
      - authorization-service
      - projects-service
    networks:
      - erp-net
  vendor-service:
    image: ghcr.io/ayist-erp-system/vendor-service:${TAG_VENDOR:-latest}
    restart: unless-stopped
    environment:
      <<: *common_env
      GIN_MODE: release
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DB_SCHEMA: vendor_schema
      DB_USER: vendor_user
    depends_on:
      - auth-service
      - authorization-service
      - finance-service
      - documents-service
    networks:
      - erp-net
