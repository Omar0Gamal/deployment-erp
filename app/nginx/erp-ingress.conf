# --- HTTP server (for Certbot verification + redirect) ---
server {
  listen 80;
  server_name erp-ayist-api.dynv6.net;

  # Redirect all HTTP to HTTPS
  return 301 https://$host$request_uri;
}

# --- HTTPS server ---
server {
  listen 443 ssl;
  server_name erp-ayist-api.dynv6.net;

  ssl_certificate /etc/letsencrypt/live/erp-ayist-api.dynv6.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp-ayist-api.dynv6.net/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Map the same paths as Helm ingress: /api/<shortPath>
  location /api/auth {
    proxy_pass http://auth-service:8080;
  }
  location /api/user {
    proxy_pass http://user-service:8080;
  }
  location /api/staff {
    proxy_pass http://staff-service:8080;
  }
#  location /api/staff {
#    rewrite ^/api/staff/?(.*)$ /$1 break;
#    proxy_pass http://staff-service:8080;
#    proxy_redirect off;
#  }
  location /api/payroll {
    proxy_pass http://payroll-service:8080;
  }
  location /api/finance {
    proxy_pass http://finance-service:8080;
  }
  location /api/projects {
    proxy_pass http://projects-service:8080;
  }
  location /api/crm {
    proxy_pass http://crm-service:8080;
  }
  location /api/documents {
    proxy_pass http://documents-service:8080;
  }
  location /api/notifications {
    proxy_pass http://notifications-service:8080;
  }
  location /api/analytics {
    proxy_pass http://analytics-service:8080;
  }
  location /api/admin {
    proxy_pass http://admin-service:8080;
  }
  location /api/tenant {
    proxy_pass http://tenant-service:8080;
  }
  location /api/authorization {
    proxy_pass http://authorization-service:8080;
  }
  location /api/vendor {
    proxy_pass http://vendor-service:8080;
  }
  # location /admin {
  #   proxy_pass http://admin-dashboard:8080;
  # }
  # location / {
  #    proxy_pass http://erp-app:8080;
  # }
}