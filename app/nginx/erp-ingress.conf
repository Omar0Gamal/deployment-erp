server {
  listen 80;
  server_name _;

  # Common proxy settings
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Map the same paths as Helm ingress: /api/<shortPath>
  location /api/auth {
    proxy_pass http://auth-service:8080;
  }
  location /api/user {
    proxy_pass http://user-service:8080;
  }
  location /api/staff {
    proxy_pass http://staff-service:8080;
  }
  location /api/payroll {
    proxy_pass http://payroll-service:8080;
  }
  location /api/finance {
    proxy_pass http://finance-service:8080;
  }
  location /api/projects {
    proxy_pass http://projects-service:8080;
  }
  location /api/crm {
    proxy_pass http://crm-service:8080;
  }
  location /api/documents {
    proxy_pass http://documents-service:8080;
  }
  location /api/notifications {
    proxy_pass http://notifications-service:8080;
  }
  location /api/analytics {
    proxy_pass http://analytics-service:8080;
  }
  location /api/admin {
    proxy_pass http://admin-service:8080;
  }
  location /api/tenant {
    proxy_pass http://tenant-service:8080;
  }
  location /api/authorization {
    proxy_pass http://authorization-service:8080;
  }
  # location /admin {
  #   proxy_pass http://admin-dashboard:8080;
  # }
  # location / {
  #    proxy_pass http://erp-app:8080;
  # }
}
